server:
  port: 0

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/telemetry/{application}
            - classpath:config/commerce/{application}/
            - classpath:config/commerce/{application}/application.yaml
      discovery:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
    enabled: true
    fetch-registry: true
    register-with-eureka: true
    initial-instance-info-replication-interval-seconds: 3